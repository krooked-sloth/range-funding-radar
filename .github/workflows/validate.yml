name: Validate directory
on:
  push:
  pull_request:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate.mjs
